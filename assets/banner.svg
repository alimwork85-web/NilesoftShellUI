<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1e2e"/>
      <stop offset="0.6" stop-color="#2a2140"/>
      <stop offset="1" stop-color="#1f3a4a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.7" r="0.45">
      <stop offset="0" stop-color="#f38ba8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#f38ba8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="24" fill="url(#glow)"/>

  <!-- أيقونة التطبيق -->
  <g transform="translate(72 88)">
    <rect width="144" height="144" rx="34" fill="#1e1e2e" stroke="#cba6f7" stroke-width="4"/>
    <rect x="34" y="26" width="72" height="92" rx="10" fill="#cdd6f4"/>
    <rect x="46" y="42" width="48" height="10" rx="5" fill="#45475a"/>
    <rect x="40" y="62" width="60" height="16" rx="6" fill="#cba6f7"/>
    <rect x="46" y="66" width="48" height="8" rx="4" fill="#313244"/>
    <rect x="46" y="88" width="48" height="10" rx="5" fill="#45475a"/>
    <circle cx="112" cy="114" r="22" fill="#f5c2e7" stroke="#1e1e2e" stroke-width="5"/>
    <circle cx="106" cy="108" r="7" fill="#fab387"/>
  </g>

  <text x="250" y="150" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="64" font-weight="700" fill="#cdd6f4">Nilesoft Shell UI</text>
  <text x="252" y="196" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="26" fill="#bac2de">Customize the Windows right-click menu, no .nss editing</text>
  <text x="252" y="238" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="26" fill="#a6adc8">خصّص قائمة الزر الأيمن بسهولة</text>

  <!-- قائمة مصغرة -->
  <g transform="translate(940 60)" font-family="Segoe UI, Arial, sans-serif" font-size="17">
    <rect width="270" height="204" rx="12" fill="#181825" fill-opacity="0.92" stroke="#cba6f7" stroke-opacity="0.7"/>
    <rect x="8" y="10" width="254" height="34" rx="7" fill="#45475a"/>
    <text x="24" y="33" fill="#cdd6f4">Open in Terminal</text>
    <text x="24" y="71" fill="#cdd6f4">Go to</text>
    <text x="24" y="105" fill="#cdd6f4">أدواتي</text>
    <text x="246" y="105" fill="#a6adc8">›</text>
    <line x1="14" y1="122" x2="256" y2="122" stroke="#45475a"/>
    <text x="24" y="150" fill="#cdd6f4">Copy as path</text>
    <text x="24" y="184" fill="#6c7086" text-decoration="line-through">Compress to ZIP</text>
  </g>
</svg>
